<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Simple EVM blockchain address validator and checksum checker."
  >

  <title>EVM Address Checker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="badge">
      EVM TOOL
    </div>

    <h1>EVM Address Checker</h1>

    <p class="subtitle">
      Validate Ethereum and EVM-compatible blockchain addresses.
    </p>

    <section class="card">

      <label for="address">
        Wallet Address
      </label>

      <div class="input-row">

        <input
          id="address"
          type="text"
          placeholder="0x..."
          autocomplete="off"
        >

        <button onclick="checkAddress()">
          Check
        </button>

      </div>

      <div
        id="result"
        class="result hidden"
      ></div>

    </section>

    <section class="info">

      <div>
        <strong>✓</strong>
        <span>Ethereum compatible</span>
      </div>

      <div>
        <strong>✓</strong>
        <span>Checksum detection</span>
      </div>

      <div>
        <strong>✓</strong>
        <span>No wallet connection</span>
      </div>

      <div>
        <strong>✓</strong>
        <span>No data stored</span>
      </div>

    </section>

    <footer>
      Runs entirely in your browser
    </footer>

  </main>

  <script src="script.js"></script>

</body>

</html>
